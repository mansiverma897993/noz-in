version: 2

project_name: promcast

before:
  hooks:
    - go mod tidy -diff
    - go test -count=1 ./...

builds:
  - id: promcast
    main: ./cmd/promcast
    binary: promcast
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/mansiverma897993/signoz/internal/version.version={{ .Version }}
        -X github.com/mansiverma897993/signoz/internal/version.commit={{ .Commit }}

archives:
  - id: binaries
    ids:
      - promcast
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

release:
  prerelease: auto
