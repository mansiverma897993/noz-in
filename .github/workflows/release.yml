name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    name: Complete release acceptance gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify tag provenance
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release-source-check.sh
      - name: Prepare the frozen research corpus
        env:
          RELEASE_CORPUS_URL: ${{ secrets.RELEASE_CORPUS_URL }}
          RELEASE_CORPUS_SHA256: ${{ vars.RELEASE_CORPUS_SHA256 }}
        run: |
          corpus_root="${RUNNER_TEMP}/promcast-research"
          ./scripts/prepare-release-corpus.sh "$corpus_root"
          echo "PROMCAST_RESEARCH_ROOT=$corpus_root" >>"$GITHUB_ENV"
      - name: Install pinned acceptance tools
        env:
          GOBIN: ${{ runner.temp }}/acceptance-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$GOBIN" >>"$GITHUB_PATH"
      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true
      - name: Run every release acceptance gate
        run: make release-gold

  publish:
    name: Publish verified release artifacts
    needs:
      - acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the same tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Recheck tag provenance
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/release-source-check.sh
      - name: Publish release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
